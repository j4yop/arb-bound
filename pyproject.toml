[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-bound"
version = "0.1.0"
description = "Is an MCX cross-contract gold spread an opportunity, or the cost of closing it?"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
arb-bound = "arbbound.cli:main"

[tool.setuptools.packages.find]
include = ["arbbound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]